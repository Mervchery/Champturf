name: Refresh predictions

# Scores the declared runners of upcoming races with the trained model (ml/models/) and saves them for the site.
# Training is done by hand (python ml/train.py) and the resulting ml/models/ files are committed — see ml/README.md.
# All times UTC; Mauritius is UTC+4.
on:
  schedule:
    - cron: "10,40 2-15 * * 4,5,6,0"   # twice an hour, 06:10–19:40 Mauritius, Thu–Sun
  workflow_dispatch:

concurrency:
  group: predict
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  predict:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: ml/requirements.txt
      - run: pip install -r ml/requirements.txt
      - run: python ml/predict.py
